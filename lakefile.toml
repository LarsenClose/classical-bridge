name = "classical-bridge"
version = "0.1.0"
keywords = ["math", "complexity", "bridge", "turing-machines"]
defaultTargets = ["ClassicalBridge"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
